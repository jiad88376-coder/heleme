<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>喝了么 - 你今天喝了吗？</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 16px; scroll-behavior: smooth; }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(145deg, #0a1628 0%, #1a2a4a 100%);
            color: #e0f0ff;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .water-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
        .water-bg .bubble {
            position: absolute; bottom: -40px;
            background: radial-gradient(circle at 30% 30%, rgba(100,200,255,0.15), transparent 70%);
            border-radius: 50%;
            animation: rise linear infinite;
        }
        @keyframes rise {
            0% { transform: translateY(0) scale(1); opacity: 0.6; }
            100% { transform: translateY(-110vh) scale(0.3); opacity: 0; }
        }
        .container { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; padding: 20px 16px 40px; }
        .header { text-align: center; padding: 30px 0 10px; }
        .header h1 {
            font-size: 3.2rem; font-weight: 900;
            background: linear-gradient(135deg, #4fc3f7, #00e5ff, #4fc3f7);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s ease-in-out infinite;
            letter-spacing: 4px;
        }
        @keyframes shimmer {
            0%,100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .header .subtitle { font-size: 0.95rem; color: rgba(160,200,255,0.6); margin-top: 4px; letter-spacing: 2px; }
        .glass-container { display: flex; justify-content: center; margin: 20px 0; }
        .glass {
            width: 120px; height: 200px;
            border: 4px solid rgba(100,200,255,0.5); border-top: none;
            border-radius: 0 0 20px 20px; position: relative;
            background: rgba(0,50,100,0.2); overflow: hidden;
            box-shadow: 0 0 30px rgba(0,200,255,0.15), inset 0 0 20px rgba(0,100,200,0.1);
            cursor: pointer; transition: transform 0.3s, box-shadow 0.3s;
        }
        .glass:hover { transform: scale(1.05); box-shadow: 0 0 40px rgba(0,200,255,0.3), inset 0 0 20px rgba(0,100,200,0.2); }
        .glass:active { transform: scale(0.95); }
        .glass .water-fill {
            position: absolute; bottom: 0; left: 0; right: 0; height: 0%;
            background: linear-gradient(180deg, rgba(0,180,255,0.6), rgba(0,100,200,0.8));
            transition: height 1s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 0 0 16px 16px;
        }
        .glass .water-fill::before {
            content: "";
            position: absolute; top: -6px; left: -10px; right: -10px; height: 12px;
            background: radial-gradient(ellipse at center, rgba(100,220,255,0.4), transparent);
            border-radius: 50%; animation: wave 2s ease-in-out infinite;
        }
        @keyframes wave {
            0%,100% { transform: translateX(-5px) scaleY(1); }
            50% { transform: translateX(5px) scaleY(1.4); }
        }
        .glass .glass-label {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.8rem; font-weight: 700;
            color: rgba(255,255,255,0.3);
            pointer-events: none; z-index: 2;
        }
        .stats { display: flex; gap: 12px; margin: 20px 0; }
        .stat-card {
            flex: 1; text-align: center;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(100,200,255,0.15);
            border-radius: 16px; padding: 16px 12px;
        }
        .stat-card .num {
            font-size: 2rem; font-weight: 800;
            background: linear-gradient(135deg, #4fc3f7, #00e5ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stat-card .label { font-size: 0.8rem; color: rgba(160,200,255,0.5); margin-top: 4px; }
        .progress-section { margin: 20px 0; }
        .progress-header {
            display: flex; justify-content: space-between;
            font-size: 0.9rem; color: rgba(160,200,255,0.7); margin-bottom: 8px;
        }
        .progress-bar {
            height: 14px; background: rgba(255,255,255,0.08);
            border-radius: 10px; overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }
        .progress-fill {
            height: 100%; width: 0%; border-radius: 10px;
            background: linear-gradient(90deg, #0288d1, #00bcd4, #4fc3f7);
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .progress-fill::after {
            content: "";
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: progressGlow 2s ease-in-out infinite;
        }
        @keyframes progressGlow {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .progress-fill.fire { background: linear-gradient(90deg, #ff6f00, #ff3d00); animation: pulseDanger 0.8s ease-in-out infinite; }
        @keyframes pulseDanger { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }
        .btn-group { display: flex; gap: 12px; margin: 24px 0; }
        .btn {
            flex: 1; padding: 16px 0; border: none; border-radius: 16px;
            font-size: 1.1rem; font-weight: 700; cursor: pointer;
            letter-spacing: 2px; position: relative; overflow: hidden;
            transition: all 0.2s;
        }
        .btn:active { transform: scale(0.95); }
        .btn-drink {
            background: linear-gradient(135deg, #0288d1, #00acc1);
            color: #fff; box-shadow: 0 4px 20px rgba(0,150,200,0.4);
        }
        .btn-drink:hover { box-shadow: 0 6px 30px rgba(0,150,200,0.6); transform: translateY(-2px); }
        .btn-small {
            flex: 0.6; padding: 16px 0;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(100,200,255,0.2); border-radius: 16px;
            color: rgba(160,200,255,0.8);
            font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .btn-small:hover { background: rgba(255,255,255,0.12); }
        .btn-small:active { transform: scale(0.95); }
        .btn-custom { flex: 0.8; }
        .ripple {
            position: absolute; border-radius: 50%;
            background: rgba(255,255,255,0.4);
            transform: scale(0);
            animation: rippleAnim 0.6s ease-out;
            pointer-events: none;
        }
        @keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }
        .message-box {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(100,200,255,0.1);
            border-radius: 16px; padding: 20px 18px;
            margin: 20px 0; min-height: 80px;
            display: flex; align-items: center; gap: 14px;
        }
        .message-box .avatar {
            width: 48px; height: 48px; border-radius: 50%;
            background: linear-gradient(135deg, #0288d1, #00e5ff);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.6rem; flex-shrink: 0;
        }
        .message-box .msg-text { font-size: 0.95rem; line-height: 1.6; color: rgba(200, 230, 255, 0.9); }
        .message-box .msg-text .highlight { color: #4fc3f7; font-weight: 700; }
        .section-title { font-size: 1.1rem; font-weight: 700; margin: 28px 0 14px; color: rgba(160,200,255,0.7); display: flex; align-items: center; gap: 8px; }
        .history-list { display: flex; flex-direction: column; gap: 8px; }
        .history-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 16px; background: rgba(255,255,255,0.04);
            border-radius: 12px; border: 1px solid rgba(100,200,255,0.06);
        }
        .history-item:hover { background: rgba(255,255,255,0.08); }
        .history-item .hi-time { font-size: 0.8rem; color: rgba(160,200,255,0.4); }
        .history-item .hi-amount { font-weight: 700; color: #4fc3f7; }
        .history-item .hi-emoji { font-size: 1.2rem; }
        .history-empty { text-align: center; color: rgba(160,200,255,0.3); padding: 30px; font-size: 0.9rem; }
        .week-chart { display: flex; gap: 6px; margin: 12px 0 20px; align-items: flex-end; }
        .week-bar-wrapper { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .week-bar {
            width: 100%; border-radius: 6px 6px 0 0;
            background: linear-gradient(180deg, rgba(0,200,255,0.6), rgba(0,100,200,0.4));
            min-height: 4px; transition: height 0.6s ease;
        }
        .week-bar.today { background: linear-gradient(180deg, #4fc3f7, #0288d1); box-shadow: 0 0 12px rgba(0,200,255,0.3); }
        .week-bar-label { font-size: 0.7rem; color: rgba(160,200,255,0.5); }
        .week-bar-val { font-size: 0.65rem; color: rgba(160,200,255,0.35); margin-top: 2px; }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 100; justify-content: center; align-items: center; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal {
            background: linear-gradient(145deg, #1a2a4a, #0a1628);
            border: 1px solid rgba(100,200,255,0.2); border-radius: 24px;
            padding: 28px 24px; width: 100%; max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .modal h2 { font-size: 1.3rem; margin-bottom: 20px; color: rgba(160,200,255,0.9); }
        .modal label { display: block; font-size: 0.85rem; color: rgba(160,200,255,0.6); margin-bottom: 6px; margin-top: 16px; }
        .modal input, .modal select {
            width: 100%; padding: 10px 14px; border-radius: 10px;
            border: 1px solid rgba(100,200,255,0.2);
            background: rgba(0,20,40,0.6); color: #e0f0ff;
            font-size: 1rem; outline: none;
        }
        .modal input:focus, .modal select:focus { border-color: #4fc3f7; }
        .modal .modal-actions { display: flex; gap: 12px; margin-top: 24px; }
        .modal .modal-actions .btn { padding: 12px 0; font-size: 0.95rem; }
        .btn-secondary { background: rgba(255,255,255,0.08); color: rgba(160,200,255,0.8); }
        .btn-secondary:hover { background: rgba(255,255,255,0.12); }
        .toast {
            position: fixed; top: 20px; left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(0,0,0,0.8); backdrop-filter: blur(12px);
            border: 1px solid rgba(100,200,255,0.2);
            border-radius: 16px; padding: 14px 24px;
            color: #e0f0ff; font-size: 0.95rem; z-index: 200;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none; text-align: center; max-width: 80vw;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .footer { text-align: center; padding: 30px 0 20px; color: rgba(160,200,255,0.2); font-size: 0.75rem; }
        .footer a { color: rgba(160,200,255,0.3); text-decoration: none; }
        @media (max-width: 400px) {
            .header h1 { font-size: 2.5rem; }
            .stat-card .num { font-size: 1.6rem; }
            .btn { font-size: 1rem; padding: 14px 0; }
        }
    </style>
</head>
<body>

<div class="water-bg" id="waterBg"></div>
<div class="toast" id="toast"></div>

<div class="container">
    <div class="header">
        <h1>喝了么</h1>
        <div class="subtitle">—— 你今天喝了吗？</div>
    </div>

    <div class="glass-container">
        <div class="glass" id="glass" onclick="drink(200)" title="点击喝水！">
            <div class="water-fill" id="waterFill"></div>
            <div class="glass-label" id="glassLabel">💧</div>
        </div>
    </div>

    <div class="stats">
        <div class="stat-card">
            <div class="num" id="todayTotal">0</div>
            <div class="label">今日已喝 (ml)</div>
        </div>
        <div class="stat-card">
            <div class="num" id="todayCount">0</div>
            <div class="label">喝了多少次</div>
        </div>
        <div class="stat-card">
            <div class="num" id="cupSize">200</div>
            <div class="label">每杯 (ml)</div>
        </div>
    </div>

    <div class="progress-section">
        <div class="progress-header">
            <span>每日目标</span>
            <span id="progressText">0 / 2000 ml</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <div class="btn-group">
        <button class="btn btn-drink" onclick="drink(200)">
            💧 喝一杯
            <span class="ripple" id="ripple1"></span>
        </button>
        <button class="btn-small" onclick="drink(500)">🥤 大杯 500ml</button>
        <button class="btn-small btn-custom" onclick="openModal(&apos;custom&apos;)">✏️ 自定义</button>
    </div>

    <div class="message-box" id="messageBox">
        <div class="avatar" id="msgAvatar">💀</div>
        <div class="msg-text" id="msgText">
            点击 <span class="highlight">💧 喝一杯</span> 开始喝水，
            不然你的身体就要开始回收水分了 ☠️
        </div>
    </div>

    <div class="section-title">📊 本周喝水趋势</div>
    <div class="week-chart" id="weekChart"></div>

    <div class="section-title" style="margin-top:0;">
        📋 今日喝水记录
        <span style="font-size:0.75rem;color:rgba(160,200,255,0.3);margin-left:auto;">
            <a href="#" onclick="clearToday();return false;" style="color:rgba(255,80,80,0.5);text-decoration:none;">清空</a>
        </span>
    </div>
    <div class="history-list" id="historyList">
        <div class="history-empty">还没有喝水记录，快去喝一杯吧！💧</div>
    </div>

    <div class="btn-group" style="margin-top: 16px;">
        <button class="btn-small" onclick="openModal(&apos;settings&apos;)" style="flex:1;">⚙️ 设置</button>
        <button class="btn-small" onclick="resetToday()" style="flex:1;color:rgba(255,80,80,0.6);">🔄 重置今日</button>
    </div>

    <div class="footer">
        喝了么 v1.0 · 灵感来自 死了么 · 记得喝水 💙
    </div>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <h2 id="modalTitle">⚙️ 设置</h2>
        <div id="modalBody">
            <label>每日目标 (ml)</label>
            <input type="number" id="goalInput" value="2000" min="100" max="10000">
            <label>每杯水量 (ml)</label>
            <input type="number" id="cupInput" value="200" min="50" max="2000">
            <label>提醒间隔 (分钟)</label>
            <select id="reminderInterval">
                <option value="15">15 分钟（猛灌模式）</option>
                <option value="30" selected>30 分钟（正常模式）</option>
                <option value="60">60 分钟（佛系模式）</option>
                <option value="120">120 分钟（你已经是条咸鱼了）</option>
                <option value="0">关闭提醒</option>
            </select>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal()">取消</button>
                <button class="btn btn-drink" onclick="saveSettings()">保存</button>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="customModalOverlay">
    <div class="modal">
        <h2>✏️ 自定义喝水量</h2>
        <div>
            <label>喝水量 (ml)</label>
            <input type="number" id="customAmount" value="200" min="10" max="5000">
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeCustomModal()">取消</button>
                <button class="btn btn-drink" onclick="confirmCustomDrink()">开喝！</button>
            </div>
        </div>
    </div>
</div>

<script>
const STATE_KEY = 'heleme_state';

const MESSAGES = {
    remind: [
        { emoji: '💀', text: '还不喝水？你是想变成 <span class="highlight">木乃伊</span> 吗？' },
        { emoji: '🫀', text: '你的 <span class="highlight">肾</span> 在哭泣……听到了吗？' },
        { emoji: '🏜️', text: '再不喝水，你的身体就要开始 <span class="highlight">回收水分</span> 了 ☠️' },
        { emoji: '🧟', text: '你已经处于 <span class="highlight">脱水边缘</span>……喝杯水还能抢救一下' },
        { emoji: '🪦', text: '你离 <span class="highlight">渴死</span> 还有多远？喝一杯吧！' },
        { emoji: '🌵', text: '你已经比 <span class="highlight">仙人掌</span> 还耐旱了，但仙人掌也会喝水的好吗！' },
        { emoji: '⚰️', text: '（棺材板振动）<span class="highlight">喝……水……</span>' },
        { emoji: '😵', text: '你的大脑：<span class="highlight">-30% 运转速度</span>。原因：缺水。' },
        { emoji: '👻', text: '再不去喝水，你的 <span class="highlight">灵魂</span> 就要飘走了……' },
        { emoji: '🔥', text: '你的喉咙在 <span class="highlight">冒烟</span>，你听到了吗？🔥' },
        { emoji: '😈', text: '<span class="highlight">喝了么？</span> 没喝？好的，你的死亡倒计时又近了一步 ⌛' },
        { emoji: '🧊', text: '水在冰箱里都 <span class="highlight">等急了</span>，快去喝！' },
        { emoji: '🤖', text: '检测到机体 <span class="highlight">含水量不足</span>，建议立即补水，否则将进入休眠模式 🛑' },
    ],
    praise: [
        { emoji: '💪', text: '好样的！你离 <span class="highlight">健康活到老</span> 又近了一步！' },
        { emoji: '🌟', text: '优秀！你已经比 <span class="highlight">99%</span> 的人更会喝水了！' },
        { emoji: '🐟', text: '你现在就像一条 <span class="highlight">快乐的小鱼</span> 🐠 继续保持！' },
        { emoji: '🏆', text: '恭喜！你的 <span class="highlight">身体含水量</span> 正在恢复正常！' },
        { emoji: '🎉', text: '又喝了一杯！<span class="highlight">死亡倒计时</span> 又推迟了！' },
        { emoji: '🧠', text: '大脑得到了 <span class="highlight">滋润</span>，智商+10！' },
        { emoji: '✨', text: '细胞们在 <span class="highlight">欢呼</span>！感谢你送来生命之源！' },
        { emoji: '😊', text: '很好，继续保持，你将会成为 <span class="highlight">水做的美人</span>（或帅哥）' },
    ],
    goal: [
        { emoji: '🎊', text: '🎉🎉🎉 <span class="highlight">今日目标达成！</span> 🎉🎉🎉<br>你成功地没有被渴死！' },
        { emoji: '👑', text: '<span class="highlight">喝水之王</span> 就是你！今日目标已达成！<br>（你暂时可以再多活一天了）' },
        { emoji: '🏅', text: '<span class="highlight">成就解锁：今日饮水自由！</span><br>你的器官们表示很满意 💯' },
    ],
    over: [
        { emoji: '💦', text: '你已经喝了很多水了！<span class="highlight">别把自己灌成水母</span> 🎐' },
        { emoji: '🚽', text: '友情提示：喝太多小心 <span class="highlight">住厕所</span> 🚽' },
        { emoji: '🫧', text: '你是 <span class="highlight">水做的</span> 吗？差不多了够了！' },
    ]
};

let state = loadState();
let reminderTimer = null;

function getDefaultState() {
    const today = new Date().toISOString().slice(0, 10);
    return {
        goal: 2000, cupSize: 200, reminderInterval: 30,
        today: today, totalMl: 0, count: 0, logs: [],
        weekData: {}
    };
}

function loadState() {
    try {
        const raw = localStorage.getItem(STATE_KEY);
        if (raw) {
            const s = JSON.parse(raw);
            const today = new Date().toISOString().slice(0, 10);
            if (s.today !== today) {
                if (s.today) {
                    s.weekData[s.today] = (s.weekData[s.today] || 0) + s.totalMl;
                }
                s.today = today;
                s.totalMl = 0;
                s.count = 0;
                s.logs = [];
            }
            return s;
        }
    } catch(e) {}
    return getDefaultState();
}

function saveState() {
    localStorage.setItem(STATE_KEY, JSON.stringify(state));
}

function drink(ml) {
    if (!ml || ml <= 0) return;
    state.totalMl += ml;
    state.count += 1;
    state.logs.push({
        time: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }),
        ml: ml
    });
    const today = new Date().toISOString().slice(0, 10);
    state.weekData[today] = (state.weekData[today] || 0) + ml;
    saveState();
    render();
    showToast('💧 喝了 ' + ml + 'ml！');
    const ratio = state.totalMl / state.goal;
    if (ratio >= 1.2) showMessage(randomFrom(MESSAGES.over));
    else if (ratio >= 1) showMessage(randomFrom(MESSAGES.goal));
    else showMessage(randomFrom(MESSAGES.praise));
    if (event) createRipple(event);
}

function render() {
    const total = state.totalMl;
    const goal = state.goal;
    const ratio = Math.min(total / goal, 1);
    const pct = Math.round(ratio * 100);
    document.getElementById('todayTotal').textContent = total;
    document.getElementById('todayCount').textContent = state.count;
    document.getElementById('cupSize').textContent = state.cupSize;
    document.getElementById('waterFill').style.height = (ratio * 100) + '%';
    document.getElementById('progressText').textContent = total + ' / ' + goal + ' ml';
    const fill = document.getElementById('progressFill');
    fill.style.width = pct + '%';
    fill.classList.toggle('fire', total > 0 && total < goal * 0.3);
    renderHistory();
    renderWeekChart();
}

function renderHistory() {
    const list = document.getElementById('historyList');
    if (state.logs.length === 0) {
        list.innerHTML = '<div class="history-empty">还没有喝水记录，快去喝一杯吧！💧</div>';
        return;
    }
    list.innerHTML = state.logs.slice().reverse().map(function(log) {
        var emoji = log.ml >= 500 ? '🥤' : (log.ml >= 300 ? '🧋' : '💧');
        return '<div class="history-item">'
            + '<span class="hi-time">' + log.time + '</span>'
            + '<span class="hi-emoji">' + emoji + '</span>'
            + '<span class="hi-amount">+' + log.ml + 'ml</span>'
            + '</div>';
    }).join('');
}

function renderWeekChart() {
    var chart = document.getElementById('weekChart');
    var today = new Date();
    var days = [];
    for (var i = 6; i >= 0; i--) {
        var d = new Date(today);
        d.setDate(d.getDate() - i);
        days.push(d.toISOString().slice(0, 10));
    }
    var maxMl = Math.max.apply(null, days.map(function(d) { return state.weekData[d] || 0; }));
    if (maxMl < 1) maxMl = 1;
    var todayStr = new Date().toISOString().slice(0, 10);
    chart.innerHTML = days.map(function(d) {
        var ml = state.weekData[d] || 0;
        var h = Math.max((ml / maxMl) * 100, 3);
        var label = new Date(d).toLocaleDateString('zh-CN', { weekday: 'short' });
        var isToday = d === todayStr;
        return '<div class="week-bar-wrapper">'
            + '<div class="week-bar' + (isToday ? ' today' : '') + '" style="height:' + h + 'px"></div>'
            + '<div class="week-bar-val">' + (ml > 0 ? ml : '') + '</div>'
            + '<div class="week-bar-label">' + label + '</div>'
            + '</div>';
    }).join('');
}

function showMessage(msg) {
    if (!msg) return;
    document.getElementById('msgAvatar').textContent = msg.emoji || '💀';
    document.getElementById('msgText').innerHTML = msg.text;
}

function showRandomRemind() {
    showMessage(randomFrom(MESSAGES.remind));
}

function startReminder() {
    stopReminder();
    var interval = state.reminderInterval;
    if (interval <= 0) return;
    reminderTimer = setInterval(function() {
        if (state.totalMl < state.goal) {
            var msg = randomFrom(MESSAGES.remind);
            showMessage(msg);
            var plainText = msg.text.replace(/<[^>]*>/g, '');
            showToast(msg.emoji + ' ' + plainText);
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification('喝了么 💧', {
                    body: plainText
                });
            }
            if (navigator.vibrate) navigator.vibrate(200);
        }
    }, interval * 60 * 1000);
}

function stopReminder() {
    if (reminderTimer) {
        clearInterval(reminderTimer);
        reminderTimer = null;
    }
}

var toastTimer = null;
function showToast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { el.classList.remove('show'); }, 2500);
}

var modalMode = 'settings';
function openModal(mode) {
    modalMode = mode;
    if (mode === 'settings') {
        document.getElementById('goalInput').value = state.goal;
        document.getElementById('cupInput').value = state.cupSize;
        document.getElementById('reminderInterval').value = state.reminderInterval;
        document.getElementById('modalTitle').textContent = '⚙️ 设置';
        document.getElementById('modalOverlay').classList.add('active');
    } else if (mode === 'custom') {
        document.getElementById('customAmount').value = state.cupSize;
        document.getElementById('customModalOverlay').classList.add('active');
        setTimeout(function() { document.getElementById('customAmount').focus(); }, 100);
    }
}

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
}

function closeCustomModal() {
    document.getElementById('customModalOverlay').classList.remove('active');
}

function saveSettings() {
    var goal = parseInt(document.getElementById('goalInput').value) || 2000;
    var cup = parseInt(document.getElementById('cupInput').value) || 200;
    var interval = parseInt(document.getElementById('reminderInterval').value) || 0;
    state.goal = Math.max(100, Math.min(10000, goal));
    state.cupSize = Math.max(50, Math.min(2000, cup));
    state.reminderInterval = interval;
    saveState();
    render();
    startReminder();
    closeModal();
    showToast('✅ 设置已保存！');
}

function confirmCustomDrink() {
    var ml = parseInt(document.getElementById('customAmount').value) || 0;
    if (ml <= 0) {
        showToast('❌ 请输入有效的水量！');
        return;
    }
    closeCustomModal();
    drink(ml);
}

function clearToday() {
    if (state.logs.length === 0) return;
    if (!confirm('确定要清空今日喝水记录吗？')) return;
    var today = new Date().toISOString().slice(0, 10);
    state.totalMl = 0;
    state.count = 0;
    state.logs = [];
    state.weekData[today] = 0;
    saveState();
    render();
    showToast('🗑️ 今日记录已清空');
    showMessage(randomFrom(MESSAGES.remind));
}

function resetToday() {
    if (state.totalMl === 0 && state.count === 0) {
        showToast('今天还没喝水呢，快去喝吧！💧');
        return;
    }
    if (!confirm('⚠️ 确定重置今日所有数据吗？（不包括历史周数据）')) return;
    state.totalMl = 0;
    state.count = 0;
    state.logs = [];
    saveState();
    render();
    showToast('🔄 今日已重置');
    showMessage(randomFrom(MESSAGES.remind));
}

function createRipple(e) {
    if (!e) return;
    var btn = e.currentTarget || document.querySelector('.btn-drink');
    if (!btn) return;
    var rect = btn.getBoundingClientRect();
    var ripple = document.createElement('span');
    ripple.className = 'ripple';
    var size = Math.max(rect.width, rect.height);
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
    ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
    btn.appendChild(ripple);
    setTimeout(function() { ripple.remove(); }, 600);
}

function randomFrom(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
}

document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});
document.getElementById('customModalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeCustomModal();
});

function init() {
    if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
    }
    var bg = document.getElementById('waterBg');
    for (var i = 0; i < 15; i++) {
        var b = document.createElement('div');
        b.className = 'bubble';
        var size = 10 + Math.random() * 30;
        b.style.width = size + 'px';
        b.style.height = size + 'px';
        b.style.left = Math.random() * 100 + '%';
        b.style.animationDuration = (8 + Math.random() * 12) + 's';
        b.style.animationDelay = (Math.random() * 10) + 's';
        bg.appendChild(b);
    }
    render();
    setTimeout(function() {
        if (state.totalMl < state.goal) {
            showRandomRemind();
        }
    }, 1500);
    startReminder();
}

document.addEventListener('keydown', function(e) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (e.key === ' ' || e.key === 'Spacebar') {
        e.preventDefault();
        drink(state.cupSize);
    }
});

init();
</script>
</body>
</html>
