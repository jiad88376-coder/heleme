<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>喝了么 - 你今天喝了吗？</title>

<style>

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

html{font-size:16px;scroll-behavior:smooth}

body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(145deg,#0a1628,#1a2a4a);color:#e0f0ff;min-height:100vh;overflow-x:hidden}

.water-bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}

.water-bg .bubble{position:absolute;bottom:-40px;background:radial-gradient(circle at 30% 30%,rgba(100,200,255,.15),transparent 70%);border-radius:50%;animation:rise linear infinite}

@keyframes rise{0%{transform:translateY(0)scale(1);opacity:.6}100%{transform:translateY(-110vh)scale(.3);opacity:0}}

.container{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:20px 16px 40px}

.header{text-align:center;padding:20px 0 10px}

.header h1{font-size:3.2rem;font-weight:900;background:linear-gradient(135deg,#4fc3f7,#00e5ff,#4fc3f7);background-size:200% 200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 3s ease-in-out infinite;letter-spacing:4px}

@keyframes shimmer{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}

.header .subtitle{font-size:.95rem;color:rgba(160,200,255,.6);margin-top:4px;letter-spacing:2px}

.profile-badge{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:4px 14px;background:rgba(255,255,255,.06);border-radius:20px;font-size:.8rem;color:rgba(160,200,255,.7);cursor:pointer;border:1px solid rgba(100,200,255,.1)}

.glass-container{display:flex;justify-content:center;margin:16px 0}

.glass{width:120px;height:200px;border:4px solid rgba(100,200,255,.5);border-top:none;border-radius:0 0 20px 20px;position:relative;background:rgba(0,50,100,.2);overflow:hidden;box-shadow:0 0 30px rgba(0,200,255,.15),inset 0 0 20px rgba(0,100,200,.1);cursor:pointer;transition:transform .3s,box-shadow .3s}

.glass:hover{transform:scale(1.05);box-shadow:0 0 40px rgba(0,200,255,.3),inset 0 0 20px rgba(0,100,200,.2)}

.glass:active{transform:scale(.95)}

.glass .water-fill{position:absolute;bottom:0;left:0;right:0;height:0%;background:linear-gradient(180deg,rgba(0,180,255,.6),rgba(0,100,200,.8));transition:height 1s cubic-bezier(.4,0,.2,1);border-radius:0 0 16px 16px}

.glass .water-fill::before{content:"";position:absolute;top:-6px;left:-10px;right:-10px;height:12px;background:radial-gradient(ellipse at center,rgba(100,220,255,.4),transparent);border-radius:50%;animation:wave 2s ease-in-out infinite}

@keyframes wave{0%,100%{transform:translateX(-5px)scaleY(1)}50%{transform:translateX(5px)scaleY(1.4)}}

.glass .glass-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:1.8rem;font-weight:700;color:rgba(255,255,255,.3);pointer-events:none;z-index:2}

.stats{display:flex;gap:10px;margin:16px 0}

.stat-card{flex:1;text-align:center;background:rgba(255,255,255,.05);backdrop-filter:blur(12px);border:1px solid rgba(100,200,255,.15);border-radius:16px;padding:14px 8px}

.stat-card .num{font-size:1.8rem;font-weight:800;background:linear-gradient(135deg,#4fc3f7,#00e5ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

.stat-card .label{font-size:.75rem;color:rgba(160,200,255,.5)}

.progress-section{margin:16px 0}

.progress-header{display:flex;justify-content:space-between;font-size:.85rem;color:rgba(160,200,255,.7);margin-bottom:6px}

.progress-bar{height:12px;background:rgba(255,255,255,.08);border-radius:10px;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.3)}

.progress-fill{height:100%;width:0%;border-radius:10px;background:linear-gradient(90deg,#0288d1,#00bcd4,#4fc3f7);transition:width .8s cubic-bezier(.4,0,.2,1);position:relative}

.progress-fill::after{content:"";position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);animation:progressGlow 2s ease-in-out infinite}

@keyframes progressGlow{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

.progress-fill.fire{background:linear-gradient(90deg,#ff6f00,#ff3d00);animation:pulseDanger .8s ease-in-out infinite}

@keyframes pulseDanger{0%,100%{opacity:1}50%{opacity:.7}}

.btn-group{display:flex;gap:10px;margin:20px 0}

.btn{flex:1;padding:14px 0;border:none;border-radius:14px;font-size:1.05rem;font-weight:700;cursor:pointer;letter-spacing:2px;position:relative;overflow:hidden;transition:all .2s}

.btn:active{transform:scale(.95)}

.btn-drink{background:linear-gradient(135deg,#0288d1,#00acc1);color:#fff;box-shadow:0 4px 20px rgba(0,150,200,.4)}

.btn-drink:hover{box-shadow:0 6px 30px rgba(0,150,200,.6);transform:translateY(-2px)}

.btn-sm{flex:.6;padding:14px 0;background:rgba(255,255,255,.08);border:1px solid rgba(100,200,255,.2);border-radius:14px;color:rgba(160,200,255,.8);font-size:.95rem;font-weight:600;cursor:pointer;transition:all .2s}

.btn-sm:hover{background:rgba(255,255,255,.12)}

.btn-sm:active{transform:scale(.95)}

.btn-custom{flex:.75}

.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.4);transform:scale(0);animation:rippleAnim .6s ease-out;pointer-events:none}

@keyframes rippleAnim{to{transform:scale(4);opacity:0}}

.msg-box{background:rgba(0,0,0,.3);border:1px solid rgba(100,200,255,.1);border-radius:16px;padding:16px;min-height:76px;display:flex;align-items:center;gap:12px}

.msg-box .avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#0288d1,#00e5ff);display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0}

.msg-box .msg-text{font-size:.9rem;line-height:1.5;color:rgba(200,230,255,.9)}

.msg-box .msg-text .hl{color:#4fc3f7;font-weight:700}

.sec-title{font-size:1.05rem;font-weight:700;margin:24px 0 12px;color:rgba(160,200,255,.7);display:flex;align-items:center;gap:8px}

.tab-bar{display:flex;gap:4px;margin:12px 0;background:rgba(255,255,255,.04);border-radius:12px;padding:3px}

.tab{flex:1;text-align:center;padding:8px 0;border-radius:10px;font-size:.85rem;font-weight:600;cursor:pointer;color:rgba(160,200,255,.5);transition:all .2s}

.tab.active{background:rgba(100,200,255,.15);color:#4fc3f7}

.panel{display:none}

.panel.active{display:block}

.history-list{display:flex;flex-direction:column;gap:6px}

.history-item{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:rgba(255,255,255,.04);border-radius:10px;border:1px solid rgba(100,200,255,.06)}

.history-item .hi-time{font-size:.8rem;color:rgba(160,200,255,.4)}

.history-item .hi-amount{font-weight:600;color:#4fc3f7}

.history-empty{text-align:center;color:rgba(160,200,255,.3);padding:24px;font-size:.85rem}

.week-chart{display:flex;gap:4px;margin:8px 0 12px;align-items:flex-end}

.wk-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}

.wk-bar{width:100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,rgba(0,200,255,.6),rgba(0,100,200,.4));min-height:3px;transition:height .6s ease}

.wk-bar.today{background:linear-gradient(180deg,#4fc3f7,#0288d1);box-shadow:0 0 8px rgba(0,200,255,.3)}

.wk-label{font-size:.65rem;color:rgba(160,200,255,.5)}

.wk-val{font-size:.6rem;color:rgba(160,200,255,.3)}

.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);z-index:100;justify-content:center;align-items:center;padding:16px}

.overlay.active{display:flex}

.modal{background:linear-gradient(145deg,#1a2a4a,#0a1628);border:1px solid rgba(100,200,255,.2);border-radius:24px;padding:28px 24px;width:100%;max-width:400px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}

.modal h2{font-size:1.25rem;margin-bottom:16px;color:rgba(160,200,255,.9)}

.modal p{font-size:.85rem;color:rgba(160,200,255,.5);margin-bottom:16px;line-height:1.5}

.modal label{display:block;font-size:.82rem;color:rgba(160,200,255,.6);margin-bottom:5px;margin-top:14px}

.modal input,.modal select{width:100%;padding:10px 14px;border-radius:10px;border:1px solid rgba(100,200,255,.2);background:rgba(0,20,40,.6);color:#e0f0ff;font-size:1rem;outline:none}

.modal input:focus,.modal select:focus{border-color:#4fc3f7}

.modal .m-actions{display:flex;gap:10px;margin-top:20px}

.modal .m-actions .btn{padding:11px 0;font-size:.9rem}

.btn-ghost{background:rgba(255,255,255,.08);color:rgba(160,200,255,.8)}

.btn-ghost:hover{background:rgba(255,255,255,.12)}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%)translateY(-120px);background:rgba(0,0,0,.85);backdrop-filter:blur(12px);border:1px solid rgba(100,200,255,.2);border-radius:14px;padding:12px 20px;color:#e0f0ff;font-size:.9rem;z-index:200;transition:transform .45s cubic-bezier(.34,1.56,.64,1);pointer-events:none;text-align:center;max-width:85vw}

.toast.show{transform:translateX(-50%)translateY(0)}

.footer{text-align:center;padding:24px 0 16px;color:rgba(160,200,255,.15);font-size:.7rem}

.footer a{color:rgba(160,200,255,.25);text-decoration:none}

@media(max-width:400px){.header h1{font-size:2.5rem}.stat-card .num{font-size:1.5rem}.glass{width:100px;height:170px}}

.lb-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(255,255,255,.04);border-radius:10px;margin-bottom:6px;border:1px solid rgba(100,200,255,.06)}

.lb-rank{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;flex-shrink:0}

.lb-rank.gold{background:linear-gradient(135deg,#ffd700,#ffaa00);color:#3d2b00}

.lb-rank.silver{background:linear-gradient(135deg,#c0c0c0,#a0a0a0);color:#333}

.lb-rank.bronze{background:linear-gradient(135deg,#cd7f32,#b8860b);color:#fff}

.lb-rank.normal{background:rgba(100,200,255,.15);color:#4fc3f7}

.lb-info{flex:1;min-width:0}

.lb-name{font-size:.85rem;font-weight:600;color:rgba(200,230,255,.9)}

.lb-meta{font-size:.7rem;color:rgba(160,200,255,.4)}

.lb-stat{text-align:right}

.lb-stat .num{font-size:1rem;font-weight:700;color:#4fc3f7}

.lb-stat .lbl{font-size:.65rem;color:rgba(160,200,255,.3)}

.lb-bar{height:4px;background:rgba(255,255,255,.06);border-radius:4px;margin-top:4px;overflow:hidden}
.lb-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#0288d1,#4fc3f7);transition:width .5s ease}
.lb-bar-fill.top1{background:linear-gradient(90deg,#ffd700,#ffaa00)}
.lb-bar-fill.top2{background:linear-gradient(90deg,#c0c0c0,#a0a0a0)}
.lb-bar-fill.top3{background:linear-gradient(90deg,#cd7f32,#b8860b)}
.lb-you{display:inline-block;font-size:.65rem;background:linear-gradient(135deg,#0288d1,#00acc1);color:#fff;padding:0 6px;border-radius:8px;margin-left:4px;vertical-align:middle}
.lb-empty{padding:30px 0;text-align:center}
.lb-status{text-align:center;font-size:.7rem;color:rgba(160,200,255,.35);margin-top:8px;padding-bottom:4px}
.lb-item.me{background:rgba(0,150,255,.08);border-color:rgba(0,150,255,.2)}
.lb-count{font-size:.65rem;color:rgba(160,200,255,.4);margin-top:1px}


.snooze-bar{display:none;align-items:center;gap:8px;padding:8px 14px;background:rgba(255,100,50,.1);border:1px solid rgba(255,100,50,.2);border-radius:10px;margin:8px 0;font-size:.8rem;color:rgba(255,150,100,.8)}

.snooze-bar.show{display:flex}

.snooze-bar .cd{color:#ff6f00;font-weight:700}

</style>

</head>

<body>

<div class="water-bg" id="waterBg"></div>

<div class="toast" id="toast"></div>

<style>
.mode-tabs{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
.mode-tab{padding:6px 18px;border-radius:20px;font-size:.85rem;font-weight:600;cursor:pointer;background:rgba(255,255,255,.05);color:rgba(160,200,255,.4);border:1px solid rgba(100,200,255,.08);transition:all .2s}
.mode-tab.active{background:rgba(0,150,255,.15);color:#4fc3f7;border-color:rgba(0,150,255,.3)}
.mode-tab:hover{background:rgba(255,255,255,.08)}
.mode-water{display:none}
.mode-workout{display:none}
.mode-water.active{display:block}
.mode-workout.active{display:block}
</style>
<div class="container">

<div class="header">
<div class="mode-tabs">
<span class="mode-tab active" id="modeWater" onclick="switchMode('water')">💧 喝了么</span>
<span class="mode-tab" id="modeWorkout" onclick="switchMode('workout')">💪 撸了么</span>
</div>

<h1 id="appTitle">喝了么</h1>

<div class="subtitle" id="appSubtitle">—— 你今天喝了吗？</div>

<div class="profile-badge" id="profileBadge" onclick="openModal(&apos;profile&apos;)"><span id="profileEmoji">👋</span> <span id="profileName">未设置</span></div>

</div>

<div class="mode-water active"><div class="glass-container">

<div class="glass" id="glass" onclick="drink(state.cupSize)">

<div class="water-fill" id="waterFill"></div>

<div class="glass-label" id="glassLabel">👋</div>

</div>

</div></div>

<div class="mode-workout"><div class="gym-container" style="display:flex;justify-content:center;margin:16px 0">
<div class="gym-ring" style="width:120px;height:200px;border:4px solid rgba(255,150,50,.5);border-top:none;border-radius:0 0 20px 20px;position:relative;background:rgba(80,20,0,.2);overflow:hidden;box-shadow:0 0 30px rgba(255,100,0,.15),inset 0 0 20px rgba(180,60,0,.1);cursor:pointer;transition:transform .3s,box-shadow .3s">
<div class="gym-fill" id="gymFill" style="position:absolute;bottom:0;left:0;right:0;height:0%;background:linear-gradient(180deg,rgba(255,150,0,.6),rgba(200,80,0,.8));transition:height 1s cubic-bezier(.4,0,.2,1);border-radius:0 0 16px 16px"></div>
<div class="gym-label" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:1.8rem;font-weight:700;color:rgba(255,255,255,.3);pointer-events:none;z-index:2">💪</div>
</div></div></div>

<div class="stats">

<div class="stat-card"><div class="num" id="todayTotal">0</div><div class="label"id="statLabel1">今日已喝<id="statUnit1">(ml)</div></div>

<div class="stat-card"><div class="num" id="todayCount">0</div><div class="label"id="statLabel2">喝了<id="statUnit2">次数</div></div>

<div class="stat-card"><div class="num" id="goalDisplay">2000</div><div class="label">推荐目标</div></div>

</div>

<div class="progress-section">

<div class="progress-header"><span id="progressLabel">进度</span><span id="progressText">0 / 2000 ml</span></div>

<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

</div>

<div class="snooze-bar" id="snoozeBar">

<span>? 提醒已暂停</span>

<span class="cd" id="snoozeCountdown"></span>

<button onclick="cancelSnooze()" style="background:none;border:none;color:#4fc3f7;cursor:pointer;font-size:.8rem;margin-left:auto">恢复</button>

</div>

<div class="btn-group">

<button class="btn btn-drink" onclick="drink(state.cupSize)">🥤<span class="ripple"></span></button>

<button class="btn-sm" onclick="drink(500)">💪</button>

<button class="btn-sm btn-custom" onclick="openModal(&apos;custom&apos;)">✍️</button>

</div>

<div class="msg-box" id="msgBox">

<div class="avatar" id="msgAvatar">👋</div>

<div class="msg-text" id="msgText">点击 <span class="hl">🥤</span> 开始喝水</div>

</div>

<div class="tab-bar" id="mainTabs">

<div class="tab active" onclick="switchTab(&apos;history&apos;,this)">📋</div>

<div class="tab" onclick="switchTab(&apos;chart&apos;,this)">📈</div>

<div class="tab" onclick="switchTab(&apos;leaderboard&apos;,this)">🏆</div>

</div>

<div class="panel active" id="panelHistory">

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">

<span style="font-size:.8rem;color:rgba(160,200,255,.5)">今日喝水记录</span>

<a href="#" onclick="clearToday();return false" style="font-size:.75rem;color:rgba(255,80,80,.5);text-decoration:none">清空</a>

</div>

<div class="history-list" id="historyList"><div class="history-empty">还没有喝水记录 😂</div></div>

</div>

<div class="panel" id="panelChart">

<div style="font-size:.8rem;color:rgba(160,200,255,.5);margin-bottom:6px">本周趋势</div>

<div class="week-chart" id="weekChart"></div>

</div>

<div class="panel" id="panelLeaderboard">

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">

<span style="font-size:.8rem;color:rgba(160,200,255,.5)">排行榜</span>



</div>

<div id="leaderboardList"></div>


</div>
<div class="btn-group" style="margin-top:12px">

<button class="btn-sm" onclick="openModal(&apos;settings&apos;)" style="flex:1">⚙️</button>

<button class="btn-sm" onclick="resetToday()" style="flex:1;color:rgba(255,80,80,.6)">🔄</button>

<button class="btn-sm" onclick="shareApp()" style="flex:1">📤</button>

</div>

<div class="footer">喝了么 v4.0 · 💧 💪 记得锻炼</div>

</div>

<!--- Share --->

<div class="overlay" id="shareModalOverlay">

<div class="modal" style="text-align:center">

<div style="font-size:3rem;margin-bottom:4px">💧</div>

<h2 style="font-size:1.6rem;margin-bottom:4px">喝了么</h2>

<p style="color:rgba(160,200,255,.5);font-size:.85rem;margin-bottom:16px">今天你喝水了吗？</p>

<div style="background:rgba(255,255,255,.04);border-radius:12px;padding:10px;margin-bottom:14px;border:1px solid rgba(100,200,255,.1)">

<div id="sharePreview" style="font-size:.8rem;color:rgba(160,200,255,.6);background:rgba(0,0,0,.2);border-radius:8px;padding:8px;text-align:left;word-break:break-all;line-height:1.5">💧 喝了么 - 今天你喝水了吗？<br><span style="font-size:.7rem;color:rgba(100,200,255,.4)">点开看看排行榜</span></div>
</div>

<div class="m-actions" style="gap:10px">
<button class="btn btn-ghost" onclick="closeShareModal()" style="flex:1">关闭</button>
<button class="btn btn-drink" onclick="copyShareLink()" style="flex:2">📋 复制分享</button>
</div>

<p style="font-size:.7rem;color:rgba(160,200,255,.25);margin-top:10px">复制后发到微信，朋友点开即可使用</p>

</div>

</div>
